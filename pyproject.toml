[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enospc-doctor"
version = "0.1.9"
description = "Diagnose which distinct cause is behind a 'No space left on device' (ENOSPC) error: block exhaustion, inode exhaustion, deleted-but-open files, or reserved-block false-full."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "zhuhroscar-tech"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
enospc-doctor = "enospc_doctor.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
